<!doctype html>
<!-- Source for assets/social-card.png (1280×640), the image link previews show.
     Render with a headless browser at 1280×640 and screenshot the page. -->
<html>
<head>
<meta charset="utf-8">
<style>
	html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #1e1e2e; }
	body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #cdd6f4; position: relative; }
	.text { position: absolute; left: 72px; top: 64px; width: 470px; }
	h1 { margin: 0 0 18px; font-size: 76px; letter-spacing: -2px; color: #f5f5f7; }
	h1 span { color: #89b4fa; }
	.tag { font-size: 34px; line-height: 1.22; font-weight: 600; color: #f5f5f7; margin-bottom: 26px; }
	.sub { font-size: 21px; line-height: 1.45; color: #a6adc8; }
	.install { position: absolute; left: 72px; bottom: 64px; font: 22px Menlo, monospace; color: #a6e3a1;
		background: #11111b; padding: 14px 20px; border-radius: 10px; border: 1px solid #313244; }
	.shot { position: absolute; left: 600px; top: 60px; width: 900px; border-radius: 12px;
		border: 1px solid #45475a; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
</style>
</head>
<body>
	<div class="text">
		<h1>Side<span>light</span></h1>
		<div class="tag">Long answers from your coding agent, made readable.</div>
		<div class="sub">Read them as a page, not a chat log. Ask about any line on the side, without derailing the conversation.</div>
	</div>
	<div class="install">omp plugin install omp-sidelight</div>
	<img class="shot" src="../assets/thread.png">
</body>
</html>
